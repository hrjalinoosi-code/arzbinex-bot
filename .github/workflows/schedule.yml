name: Send Prices to Bale

on:
  schedule:
    - cron: '41 7 * * 0,1,2,3,4,6'
    - cron: '42 8 * * 0,1,2,3,4,6'
    - cron: '43 9 * * 0,1,2,3,4,6'
    - cron: '44 10 * * 0,1,2,3,4,6'
    - cron: '45 11 * * 0,1,2,3,4,6'
    - cron: '46 12 * * 0,1,2,3,4,6'
    - cron: '47 13 * * 0,1,2,3,4,6'
    - cron: '48 14 * * 0,1,2,3,4,6'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        run: python main.py
